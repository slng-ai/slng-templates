[project]
name = "slng-pipecat-templates"
version = "0.1.0"
description = "Pipecat bots on SLNG speech to text, text to speech, and the Context Router"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[openai,runner,silero,webrtc]~=1.12.0",
    "pipecat-slng>=0.7.0,<0.8",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
